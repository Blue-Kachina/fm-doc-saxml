name: Release

# Push a tag like v0.2.0 to build standalone executables for each OS and
# attach them to a GitHub Release. PyPI publishing is a separate job that
# only runs once a PYPI_API_TOKEN secret exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  executables:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: fm-saxml-windows.exe
            built: dist/fm-saxml.exe
          - os: macos-latest
            asset: fm-saxml-macos
            built: dist/fm-saxml
          - os: ubuntu-latest
            asset: fm-saxml-linux
            built: dist/fm-saxml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install . pyinstaller
          pyinstaller --onefile --name fm-saxml \
            --collect-data fm_saxml \
            --collect-submodules fm_saxml \
            src/fm_saxml/__main__.py
        shell: bash
      - name: Smoke test
        run: ${{ matrix.built }} doctor
        shell: bash
      - name: Rename
        run: mv "${{ matrix.built }}" "${{ matrix.asset }}"
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  pypi:
    runs-on: ubuntu-latest
    needs: executables
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine && python -m build
      - run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
