[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-saxml-converter"
dynamic = ["version"]
description = "Convert FileMaker Pro Save As XML exports into structured Markdown / JSON documentation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Leering" }]
keywords = ["filemaker", "documentation", "saxml", "xml", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "lxml>=5.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "python-slugify>=8.0",
    "typer>=0.12",
    "rich>=13.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://dev.azure.com/directimpact/SWAT/_git/fm-saxml-converter"
Repository = "https://dev.azure.com/directimpact/SWAT/_git/fm-saxml-converter"

[project.scripts]
fm-saxml = "fm_saxml.cli:main"

[tool.hatch.version]
path = "src/fm_saxml/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_saxml"]

# Records the git commit in fm_saxml/_build_info.py (see hatch_build.py)
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# Ship only the package, tests and licence; planning docs and samples stay out of the sdist
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "hatch_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
